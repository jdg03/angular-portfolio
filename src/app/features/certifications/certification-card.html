<article class="certification-row">
  <a
    [href]="certification().link"
    target="_blank"
    rel="noopener noreferrer"
    class="certificate-preview"
    [attr.aria-label]="ui.certVerify[lang()] + ': ' + translate(certification().title)"
    ><img [src]="certification().image" alt="" width="92" height="68" loading="lazy"
  /></a>
  <div class="certification-info">
    <h3>
      <a [href]="certification().link" target="_blank" rel="noopener noreferrer"
        >{{ translate(certification().title) }}<span aria-hidden="true">↗</span></a
      >
    </h3>
    <p class="entry-date">{{ certification().academy }}</p>
    <p
      class="certificate-description"
      [class.is-expanded]="isExpanded()"
      [id]="'cert-description-' + certification().id"
    >
      {{ translate(certification().description) }}
    </p>
    @if (translate(certification().description).length > 120) {
      <button
        type="button"
        class="text-button"
        (click)="toggleExpanded()"
        [attr.aria-expanded]="isExpanded()"
        [attr.aria-controls]="'cert-description-' + certification().id"
      >
        {{ isExpanded() ? ui.certCollapse[lang()] : ui.certExpand[lang()] }}
      </button>
    }
  </div>
</article>
