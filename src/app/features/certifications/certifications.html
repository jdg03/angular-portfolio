<section id="certificaciones" class="content-section" aria-labelledby="certifications-title">
  <div class="section-heading">
    <h2 id="certifications-title">{{ ui.certTitle[lang()] }}</h2>
    <span class="count-badge">{{ certificationsList().length }}</span>
  </div>
  <div class="certifications-list">
    @for (cert of certificationsList(); track cert.id) {
      <app-certification-card [certification]="cert"></app-certification-card>
    }
  </div>
</section>
