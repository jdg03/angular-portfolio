<article class="project-card">
  <div class="project-info">
    <h3>{{ translate(project().title) }}</h3>
    <p>{{ translate(project().description) }}</p>
    <div class="tag-list">
      @for (tech of project().technologies; track tech.name) {
        <span class="tag">{{ tech.name }}</span>
      }
    </div>
    <img
      class="project-image"
      [src]="project().image"
      [alt]="translate(project().title)"
      width="480"
      height="270"
      loading="lazy"
    />
    <div class="project-actions">
      @if (project().github) {
        <a
          [href]="project().github"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="ui.projBtnCode[lang()] + ': ' + translate(project().title)"
          ><app-svg-icon name="GitHub" size="15"></app-svg-icon>{{ ui.projBtnCode[lang()] }}</a
        >
      }
      @if (project().link) {
        <a
          [href]="project().link"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="ui.projBtnDemo[lang()] + ': ' + translate(project().title)"
          >{{ ui.projBtnDemo[lang()] }}<span aria-hidden="true">↗</span></a
        >
      }
    </div>
  </div>
</article>
