<section id="proyectos" class="content-section" aria-labelledby="projects-title">
  <div class="section-heading">
    <h2 id="projects-title">{{ ui.projTitle[lang()] }}</h2>
    <span
      class="count-badge"
      role="status"
      aria-live="polite"
      [attr.aria-label]="filteredProjects().length + (lang() === 'es' ? ' proyectos' : ' projects')"
      >{{ filteredProjects().length }}</span
    >
  </div>
  <div class="projects-toolbar">
    <div
      class="filter-row"
      role="group"
      [attr.aria-label]="
        lang() === 'es' ? 'Filtrar proyectos por tecnología' : 'Filter projects by technology'
      "
    >
      @for (option of filterOptions; track option) {
        <button
          type="button"
          class="filter-button"
          [class.is-selected]="activeFilter() === option"
          [attr.aria-pressed]="activeFilter() === option"
          (click)="setFilter(option)"
        >
          {{ option === 'ALL' ? ui.projFilterAll[lang()] : option }}
        </button>
      }
    </div>
    <div
      class="project-navigation"
      role="group"
      [attr.aria-label]="lang() === 'es' ? 'Navegar proyectos' : 'Browse projects'"
    >
      <button
        type="button"
        class="project-arrow"
        data-project-direction="previous"
        aria-controls="project-track"
        [disabled]="!canPrevious()"
        (click)="move(-1)"
        [attr.aria-label]="lang() === 'es' ? 'Proyecto anterior' : 'Previous project'"
      >
        <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
      </button>
      <button
        type="button"
        class="project-arrow"
        data-project-direction="next"
        aria-controls="project-track"
        [disabled]="!canNext()"
        (click)="move(1)"
        [attr.aria-label]="lang() === 'es' ? 'Proyecto siguiente' : 'Next project'"
      >
        <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
      </button>
    </div>
  </div>
  <div
    #projectTrack
    id="project-track"
    class="projects-track"
    tabindex="0"
    role="region"
    [attr.aria-label]="
      lang() === 'es'
        ? 'Proyectos, usa las flechas para explorar'
        : 'Projects, use arrow keys to explore'
    "
    (scroll)="updateNavigation()"
    (keydown)="onTrackKey($event)"
  >
    @for (project of filteredProjects(); track project.id) {
      <app-project-card [project]="project"></app-project-card>
    } @empty {
      <p class="empty-state">{{ ui.projEmpty[lang()] }}</p>
    }
  </div>
</section>
