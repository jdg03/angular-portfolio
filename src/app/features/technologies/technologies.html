<section id="tecnologias" class="content-section" aria-labelledby="technologies-title">
  <h2 id="technologies-title">{{ lang() === 'es' ? 'Stack y herramientas' : 'Stack & tools' }}</h2>
  <div class="tech-groups">
    @for (group of techGroups; track group.nombre) {
      <div class="tech-group">
        <h3>
          {{ translate(group.nombre) }}<span class="count-badge">{{ group.items.length }}</span>
        </h3>
        <div class="tech-grid">
          @for (tech of group.items; track tech.name) {
            <details class="tech-item">
              <summary>
                <app-svg-icon [name]="tech.icon" size="25"></app-svg-icon
                ><span>{{ tech.name }}</span
                ><span class="material-symbols-outlined" aria-hidden="true">expand_more</span>
              </summary>
              <p>{{ translate(tech.useCase) }}</p>
            </details>
          }
        </div>
      </div>
    }
  </div>
</section>
