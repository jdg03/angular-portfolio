<fieldset class="theme-picker">
  <legend>
    {{ lang() === 'es' ? 'Apariencia' : 'Appearance' }}<span>{{ activeColor().name[lang()] }}</span>
  </legend>
  <div class="theme-options">
    @for (option of colorOptions; track option.id) {
      <button
        type="button"
        class="theme-option"
        [class.is-selected]="activeColor().id === option.id"
        [attr.aria-label]="option.name[lang()]"
        [attr.aria-pressed]="activeColor().id === option.id"
        [title]="option.name[lang()]"
        (click)="selectColor(option)"
      >
        <span class="theme-swatch" [style.background-color]="option.preview"
          ><span class="material-symbols-outlined" aria-hidden="true">{{
            activeColor().id === option.id ? 'check' : ''
          }}</span></span
        >
      </button>
    }
  </div>
</fieldset>
